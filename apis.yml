aid: lightforce-orthodontics
name: LightForce Orthodontics
description: 'LightForce Orthodontics is a Burlington, Massachusetts medical device manufacturer that
  produces 3D-printed, patient-specific orthodontic brackets marketed as "generative braces". Its
  LightBracket, LightTray indirect-bonding and LightTray Turbo products are generated from each
  patient''s digital orthodontic treatment plan and printed in the United States, giving orthodontists
  micron-level control across six dimensions and letting them preview the projected outcome before
  treatment begins. LightForce sells to orthodontic practices rather than to developers: doctors work
  through a Doctor Portal and a hosted knowledge base, and the company publishes no public developer
  portal, API reference, SDKs or machine-readable API specification. The only publicly reachable
  programmable surface is its Auth0-hosted identity tenant at id.lightforceortho.com, which serves
  standard OpenID Connect and OAuth 2.0 authorization-server discovery documents. Backed by Kleiner
  Perkins.'
